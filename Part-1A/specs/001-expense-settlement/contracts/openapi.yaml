openapi: 3.0.3
info:
  title: Expense Split & Settlement Engine API
  version: 1.0.0
  description: >
    In-memory API for recording group expenses, reading balances, generating
    deterministic settlement transfers, and resetting the ledger.
servers:
  - url: http://localhost:3000
paths:
  /expenses:
    post:
      summary: Record an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
            examples:
              equal:
                value:
                  payer: Alice
                  amount: 10.00
                  participants: [Alice, Bob, Chen]
                  description: Lunch
                  splitType: EQUAL
              exact:
                value:
                  payer: Alice
                  amount: 10.00
                  participants: [Alice, Bob]
                  description: Groceries
                  splitType: EXACT
                  exactShares:
                    Alice: 6.00
                    Bob: 4.00
      responses:
        '201':
          description: Expense recorded.
          headers:
            Content-Type:
              schema:
                type: string
                enum: [application/json]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
  /balances:
    get:
      summary: Read participant net balances
      responses:
        '200':
          description: Current balances; an empty object when the ledger is empty.
          headers:
            Content-Type:
              schema:
                type: string
                enum: [application/json]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
  /settle:
    get:
      summary: Compute a deterministic greedy settlement plan
      responses:
        '200':
          description: Ordered transfers; an empty array when no debt is outstanding.
          headers:
            Content-Type:
              schema:
                type: string
                enum: [application/json]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transfer'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
  /reset:
    delete:
      summary: Clear the in-memory ledger
      responses:
        '200':
          description: Ledger cleared.
          headers:
            Content-Type:
              schema:
                type: string
                enum: [application/json]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Ledger reset
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    ExpenseRequest:
      type: object
      additionalProperties: false
      required: [payer, amount, participants, description, splitType]
      properties:
        payer:
          type: string
          minLength: 1
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000000000
          description: Amount must not exceed 1,000,000,000.00; greater values receive HTTP 400.
        participants:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
        description:
          type: string
        splitType:
          type: string
          enum: [EQUAL, EXACT]
          description: EXACT requires exactShares; EQUAL rejects exactShares.
        exactShares:
          type: object
          description: For EXACT, keys must match participants; unrounded sum tolerance is 0.001 and cent-rounded shares must total the rounded amount.
          additionalProperties:
            type: number
            minimum: 0
    ExpenseCreated:
      type: object
      required: [id, shares]
      properties:
        id:
          type: string
        shares:
          type: object
          additionalProperties:
            type: number
            minimum: 0
    BalancesResponse:
      type: object
      required: [balances]
      properties:
        balances:
          type: object
          description: Participant or payer names mapped to net currency-unit amounts.
          additionalProperties:
            type: number
    Transfer:
      type: object
      required: [from, to, amount]
      properties:
        from:
          type: string
        to:
          type: string
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid JSON or expense fields, including amounts above 1,000,000,000.00; ledger remains unchanged.
      headers:
        Content-Type:
          schema:
            type: string
            enum: [application/json]
        X-Content-Type-Options:
          schema:
            type: string
            enum: [nosniff]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeds 10,240 bytes; ledger remains unchanged.
      headers:
        Content-Type:
          schema:
            type: string
            enum: [application/json]
        X-Content-Type-Options:
          schema:
            type: string
            enum: [nosniff]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown path or unsupported method.
      headers:
        Content-Type:
          schema:
            type: string
            enum: [application/json]
        X-Content-Type-Options:
          schema:
            type: string
            enum: [nosniff]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
